<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Location Map</title>

    <link rel="stylesheet" href="location.css">

    <!-- Leaflet Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>📍 Live Location Map</h1>
                <p>Find and track your current location</p>
            </div>

            <a class="back-link" href="dashboard.html">
                ← Back to Dashboard
            </a>
        </header>

        <div class="search-section">

            <input
                type="text"
                id="locationInput"
                placeholder="Enter a location, e.g. Nagpur"
            >

            <button onclick="searchLocation()">
                🔍 Search
            </button>

            <button onclick="getCurrentLocation()">
                📍 My Location
            </button>

        </div>

        <div id="locationStatus">
            Click "My Location" to find your live location.
        </div>

        <!-- Map -->
        <div id="map"></div>

        <div class="location-info">

            <h2>Current Location</h2>

            <p>
                <strong>Latitude:</strong>
                <span id="latitude">---</span>
            </p>

            <p>
                <strong>Longitude:</strong>
                <span id="longitude">---</span>
            </p>

        </div>

    </div>

    <!-- Leaflet Map JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="location.js"></script>

</body>
</html>
