<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReliefMap - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-circle">✚</div>
                <h1>Relief<span>Map</span></h1>
            </div>

            <h2>Welcome Back</h2>
            <p class="subtitle">
                Login to access disaster relief mapping
            </p>

            <!-- Mobile Number -->
            <div id="mobile-section">

                <label>Mobile Number</label>

                <div class="mobile-input">
                    <span>+91</span>
                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter mobile number"
                        maxlength="10"
                    >
                </div>

                <button id="otp-btn" onclick="generateOTP()">
                    Generate OTP
                </button>

            </div>


            <!-- OTP Section -->
            <div id="otp-section">

                <label>Enter OTP</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                >

                <p class="otp-message" id="otp-message"></p>

                <button onclick="verifyOTP()">
                    Verify & Login
                </button>

                <button class="resend" onclick="generateOTP()">
                    Resend OTP
                </button>

            </div>

            <p class="footer-text">
                Secure login for disaster relief volunteers
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
